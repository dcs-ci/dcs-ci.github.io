<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>DCS-CI 26 | Redirecting...</title>
    <script type="text/javascript">
        // This script takes the current URL and converts it into a query parameter
        // that index.html can read and use to set the correct route.
        var pathSegmentsToKeep = 0; // Number of segments to keep in the final path (0 for root domain)
        var l = window.location;
        l.replace(
            l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
            l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
            l.pathname.split('/').slice(1 + pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
            (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
            l.hash
        );
    </script>
</head>

<body>
</body>

</html>
